<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電脳黒影祭典｜入口</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#02030a;color:#fff;font-family:"Noto Sans JP","Yu Gothic",sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 50% 45%,rgba(45,0,90,.32),transparent 42%),linear-gradient(135deg,#010208,#08001a 48%,#01050e)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,180,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.055) 1px,transparent 1px);background-size:42px 42px}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;position:relative}
.logo-link{display:block;line-height:0;cursor:pointer;filter:drop-shadow(0 0 16px rgba(0,180,255,.5));}
.logo-link:active{transform:scale(.97)}
.logo{width:min(34vh,360px,62vw);max-height:38vh;object-fit:contain;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.subtitle{font-size:clamp(10px,1.7vw,16px);letter-spacing:.4em;color:#7cecff;text-shadow:0 0 10px #00cfff;text-align:center}
.title{margin:5px 0 11px;font-size:clamp(18px,3.5vw,32px);letter-spacing:.16em;font-weight:900;text-shadow:0 0 12px #a000ff,0 0 24px #005eff;text-align:center}
.gates{display:flex;flex-direction:column;gap:10px;width:min(680px,94vw)}
.gate{position:relative;border:1px solid #1ce8ff;border-radius:10px;padding:12px 17px;background:linear-gradient(145deg,rgba(10,30,65,.94),rgba(28,0,52,.94));box-shadow:0 0 12px rgba(0,200,255,.28),inset 0 0 20px rgba(150,0,255,.12);color:#fff;cursor:pointer;transition:.2s;overflow:hidden;min-height:86px}
.gate:before{content:"";position:absolute;left:-20%;top:0;width:140%;height:2px;background:linear-gradient(90deg,transparent,#00eaff,#ff00d9,transparent);animation:scan 2.5s linear infinite}
@keyframes scan{from{transform:translateX(-35%)}to{transform:translateX(35%)}}
.gate:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(0,230,255,.55),inset 0 0 24px rgba(150,0,255,.2)}
.gate-inner{display:grid;grid-template-columns:92px minmax(0,1fr) 145px;align-items:center;gap:12px;text-align:left}
.gate-left{text-align:center;border-right:1px solid rgba(0,220,255,.28);padding-right:12px}
.gate .num{font-size:11px;color:#7cecff;letter-spacing:.18em}
.gate-label{font-size:9px;color:#66758e;margin-top:4px;letter-spacing:.1em}
.gate-concept{font-size:clamp(11px,1.45vw,14px);color:#d9c8ff;letter-spacing:.08em;font-weight:800;margin:0 0 5px;text-shadow:0 0 8px rgba(180,80,255,.55)}
.gate-rule{font-size:clamp(10px,1.25vw,12px);color:#aeb8cc;letter-spacing:.04em;line-height:1.35}
.gate-rule strong{color:#fff}
.gate-main{min-width:0}
.gate .name{font-size:clamp(17px,2.2vw,24px);font-weight:900;letter-spacing:.1em;margin:0 0 6px}
.gate .datetime{font-size:clamp(12px,1.7vw,15px);color:#fff;letter-spacing:.06em;font-weight:700;white-space:nowrap}
.gate .datetime span{color:#69eaff}
.gate-right{text-align:right}
.gate .status{font-size:11px;color:#9dffcc;letter-spacing:.08em}
.gate .hint{font-size:9px;color:#72809a;margin-top:5px;letter-spacing:.08em}
.gate.locked{filter:grayscale(1);opacity:.42;cursor:not-allowed;box-shadow:none}
.gate.locked:hover{transform:none}
.trailer-gate{
 border-color:#ff29df;
 background:linear-gradient(145deg,rgba(35,10,65,.94),rgba(55,0,45,.94));
 box-shadow:0 0 12px rgba(255,0,210,.28),inset 0 0 20px rgba(0,120,255,.12);
}
.trailer-gate:hover{
 box-shadow:0 0 22px rgba(255,0,220,.55),inset 0 0 24px rgba(0,140,255,.2);
}
.trailer-gate .num,.trailer-gate .status{color:#ff8df1}

.footer{margin-top:10px;color:#65708a;font-size:10px;letter-spacing:.12em;text-align:center}
.corner{position:fixed;width:55px;height:55px;opacity:.7;pointer-events:none}
.c1{left:10px;top:10px;border-left:1px solid #00cfff;border-top:1px solid #00cfff}
.c2{right:10px;top:10px;border-right:1px solid #ff00e6;border-top:1px solid #ff00e6}
.c3{left:10px;bottom:10px;border-left:1px solid #ff00e6;border-bottom:1px solid #ff00e6}
.c4{right:10px;bottom:10px;border-right:1px solid #00cfff;border-bottom:1px solid #00cfff}
@media(max-width:650px){
 .wrap{padding:8px}
 .logo{width:min(30vh,270px,58vw);max-height:32vh}
 .title{margin-bottom:9px}
 .gates{width:94vw;gap:8px}
 .gate{padding:10px 9px;min-height:78px}
 .gate-inner{grid-template-columns:61px minmax(0,1fr) 88px;gap:7px}
 .gate-left{padding-right:6px}
 .gate .name{font-size:15px;letter-spacing:.04em} .gate-concept{font-size:10px;margin-bottom:3px}
 .gate-rule{font-size:9px}

 .gate .datetime{font-size:11px;letter-spacing:.01em}
 .gate .status{font-size:9px}
 .gate .hint{font-size:8px}
}
</style>
</head>

<button class="gate" data-gate="1" onclick="enterGate(1)"><div class="gate-inner"><div class="gate-left"><div class="num">GATE 01</div><div class="gate-label">ACCESS</div></div><div class="gate-main"><div class="name">第一の門</div><div class="gate-concept">― 修練の門 ―</div><div class="datetime">開催日時：<span class="gate-time"></span></div></div><div class="gate-right"><div class="status">● ACCESSIBLE</div><div class="hint">ENTER → GAME</div></div></div></button>
<button class="gate" data-gate="2" onclick="enterGate(2)"><div class="gate-inner"><div class="gate-left"><div class="num">GATE 02</div><div class="gate-label">ACCESS</div></div><div class="gate-main"><div class="name">第二の門</div><div class="gate-concept">― 極技の門 ―</div><div class="datetime">開催日時：<span class="gate-time"></span></div></div><div class="gate-right"><div class="status">● ACCESSIBLE</div><div class="hint">ENTER → GAME</div></div></div></button>
<button class="gate" data-gate="3" onclick="enterGate(3)"><div class="gate-inner"><div class="gate-left"><div class="num">GATE 03</div><div class="gate-label">ACCESS</div></div><div class="gate-main"><div class="name">第三の門</div><div class="gate-concept">― 覚醒の門 ―</div><div class="datetime">開催日時：<span class="gate-time"></span></div></div><div class="gate-right"><div class="status">● ACCESSIBLE</div><div class="hint">ENTER → GAME</div></div></div></button>
</section>

<button class="gate trailer-gate" onclick="location.href='trailer.html'">
  <div class="gate-inner">
    <div class="gate-left">
      <div class="num">TRAILER</div>
      <div class="gate-label">MOVIE</div>
    </div>
    <div class="gate-main">
      <div class="name">トレーラームービー</div>
      <div class="datetime">電脳黒影祭典 ―― 開幕予告映像</div>
    </div>
    <div class="gate-right">
      <div class="status">▶ PLAY MOVIE</div>
      <div class="hint">ENTER → TRAILER</div>
    </div>
  </div>
</button>

<div class="footer">SELECT YOUR GATE　/　SYSTEM ONLINE</div>
</main>
<script>
const TEST_MODE=false;
const gates={
  1:{open:"2026-10-10T12:30:00+09:00",close:"2026-10-16T12:30:00+09:00"},
  2:{open:"2026-10-17T12:30:00+09:00",close:"2026-10-23T12:30:00+09:00"},
  3:{open:"2026-10-24T12:30:00+09:00",close:"2026-10-31T12:30:00+09:00"}
};
function isOpen(n){if(TEST_MODE)return true;const now=new Date();return now>=new Date(gates[n].open)&&now<new Date(gates[n].close)}
function formatGateTime(n){
 const s=new Date(gates[n].open),e=new Date(gates[n].close);
 const p=v=>String(v).padStart(2,"0");
 return p(s.getMonth()+1)+"/"+p(s.getDate())+" "+p(s.getHours())+":"+p(s.getMinutes())+" ～ "+p(e.getHours())+":"+p(e.getMinutes());
}
function updateGates(){
 document.querySelectorAll(".gate[data-gate]").forEach(btn=>{
  const n=Number(btn.dataset.gate),open=isOpen(n);
  btn.classList.toggle("locked",!open);
  btn.querySelector(".status").textContent=open?"● ACCESSIBLE":"🔒 LOCKED";
  btn.querySelector(".gate-time").textContent=formatGateTime(n);
  btn.disabled=!open;
 });
}
function enterGate(n){if(!isOpen(n))return;location.href="game.html?gate="+n}
updateGates();setInterval(updateGates,1000);
</script>
</body>
