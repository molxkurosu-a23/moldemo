<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電脳黒影祭典 ― TRAILER</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#03050d;color:#fff;font-family:Arial,'Noto Sans JP',sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,210,255,.12),transparent 38%),radial-gradient(circle at 80% 20%,rgba(255,0,210,.09),transparent 30%),#03050d}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,220,255,.025) 4px);mix-blend-mode:screen}
.wrap{position:relative;width:min(1200px,94vw);text-align:center}
.title{font-size:clamp(18px,3vw,32px);font-weight:900;letter-spacing:.22em;text-shadow:0 0 14px #00d9ff;margin-bottom:18px}
.sub{font-size:10px;letter-spacing:.35em;color:#8da1b9;margin-bottom:22px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #18dfff;box-shadow:0 0 25px rgba(0,220,255,.25),0 0 55px rgba(180,0,255,.12);overflow:hidden}
.frame:before,.frame:after{content:"";position:absolute;width:35px;height:35px;z-index:3;pointer-events:none}
.frame:before{left:0;top:0;border-left:2px solid #00eaff;border-top:2px solid #00eaff}
.frame:after{right:0;bottom:0;border-right:2px solid #ff00dd;border-bottom:2px solid #ff00dd}
iframe{display:block;width:100%;height:100%;border:0;filter:none;background:#000;position:relative;z-index:5}.frame{isolation:isolate}
.back{display:inline-block;margin-top:18px;padding:10px 22px;border:1px solid rgba(0,220,255,.55);color:#9defff;text-decoration:none;font-size:12px;letter-spacing:.12em;background:rgba(0,20,40,.55)}
.back:hover{box-shadow:0 0 18px rgba(0,220,255,.35);transform:translateY(-1px)}
.note{font-size:9px;color:#68758a;margin-top:10px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="bg"></div><div class="scan"></div>
<main class="wrap">
  <div class="sub">DENNŌ KUROKAGE SAITEN</div>
  <div class="title">―― 開 幕 予 告 映 像 ――</div>
  <div class="frame">
    <iframe
      src="https://drive.google.com/file/d/1TTcvSbqQ_WM4lg_6WCQ4bnkXSALTgOVY/preview"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <a class="back" href="index.html">← 開幕門へ戻る</a>
  <div class="note">TRAILER / SYSTEM ONLINE</div>
</main>
</body>
</html>
